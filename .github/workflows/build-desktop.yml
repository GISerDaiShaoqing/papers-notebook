name: Build desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and build dependencies
        run: python -m pip install -e ".[build]"
        working-directory: app
      - name: Build standalone application
        run: python build.py
        working-directory: app
      - name: Prepare platform-specific release asset
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          suffix=""
          if [[ "$PLATFORM" == "windows-x64" ]]; then suffix=".exe"; fi
          mv "app/dist/Dai_PNS${suffix}" "app/dist/Dai_PNS-${PLATFORM}${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: Dai_PNS-${{ matrix.platform }}
          path: app/dist/Dai_PNS-${{ matrix.platform }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Dai_PNS-*
          path: release-assets
          merge-multiple: true
      - name: Publish release with desktop builds
        uses: softprops/action-gh-release@v2
        with:
          name: Dai_PNS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/Dai_PNS-windows-x64.exe
            release-assets/Dai_PNS-macos-arm64
            release-assets/Dai_PNS-linux-x64
