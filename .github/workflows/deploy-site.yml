name: Build and deploy paper notes site

on:
  push:
    branches:
      - master
    paths:
      - "notes/**"
      - "Picture/**"
      - "website/**"
      - "scripts/prepare_site.py"
      - "mkdocs.yml"
      - "requirements-site.txt"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site dependencies
        run: python -m pip install -r requirements-site.txt
      - name: Prepare note pages
        run: python scripts/prepare_site.py
      - name: Build site
        run: python -m mkdocs build --strict
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
