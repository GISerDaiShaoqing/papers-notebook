site_name: Dai_PNS · Paper Note Studio
site_description: 论文精读与个人阅读笔记
site_url: https://giserdaishaoqing.github.io/papers-notebook/
repo_url: https://github.com/GISerDaiShaoqing/papers-notebook
repo_name: GISerDaiShaoqing/papers-notebook
docs_dir: webdocs
site_dir: site
use_directory_urls: false
strict: true

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 分类索引: notes/INDEX.md
  - 按主题浏览:
      - Urban Blue and Green Space: notes/categories/urban-blue-and-green-space.md
      - Forest, Landscape and Ecosystem Services:
          - 分类概览: notes/categories/forest-landscape-and-ecosystem-services.md
          - Global patterns of tropical forest fragmentation: notes/forest-landscape-and-ecosystem-services/global-patterns-of-tropical-forest-fragmentation.md
      - Remote Sensing Data Assimilation:
          - 分类概览: notes/categories/remote-sensing-data-assimilation.md
          - A simplified data assimilation method: notes/remote-sensing-data-assimilation/a-simplified-data-assimilation-method-for-reconstructing-time-series-mo-2377ffec.md
      - Carbon Emissions and Urban Development:
          - 分类概览: notes/categories/carbon-emissions-and-urban-development.md
          - China’s CO2 emissions estimated from the bottom up: notes/carbon-emissions-and-urban-development/chinas-co2-emissions-estimated-from-the-bottom-up-recent-trends-spatial-b078b474.md
      - Urban Analytics, Mobility and Land Use:
          - 分类概览: notes/categories/urban-analytics-mobility-and-land-use.md
          - Characterizing mixed-use buildings: notes/urban-analytics-mobility-and-land-use/characterizing-mixed-use-buildings-based-on-multi-source-big-data.md
      - GIS, Remote Sensing and Spatial Methods:
          - 分类概览: notes/categories/gis-remote-sensing-and-spatial-methods.md
          - R Package gdistance: notes/gis-remote-sensing-and-spatial-methods/r-package-gdistance-distances-and-routes-on-geographical-grids.md
      - Public Health and Environmental Exposure: notes/categories/public-health-and-environmental-exposure.md
      - Urban Resilience and Disaster Risk: notes/categories/urban-resilience-and-disaster-risk.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - styles/paper-notes.css

copyright: Copyright © 2026 戴劭勍 · Shaoqing Dai
